name: Build & Release Executables

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release para fazer upload dos binários (ex: v2.1.0)'
        required: true
        default: 'v2.1.0'

jobs:
  build-windows-installer:
    name: Compilar instalador Windows (.exe NSIS com Node.js embutido)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18 (para instalar dependências)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependências (com binários nativos Windows)
        run: npm install

      - name: Extrair versão do package.json
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Versão: $version"

      - name: Baixar Node.js 18 portable (zip) para embutir no instalador
        shell: pwsh
        run: |
          $nodeVersion = "18.20.4"
          $nodeUrl = "https://nodejs.org/dist/v${nodeVersion}/node-v${nodeVersion}-win-x64.zip"
          echo "Baixando Node.js portable de: $nodeUrl"
          Invoke-WebRequest -Uri $nodeUrl -OutFile "node-portable.zip" -UseBasicParsing
          echo "Extraindo Node.js portable..."
          Expand-Archive -Path "node-portable.zip" -DestinationPath "node-portable-extracted" -Force
          # Mover para pasta node/ dentro do diretório do agente
          $nodeDir = Get-ChildItem "node-portable-extracted" -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Path "node" -Force | Out-Null
          Copy-Item "$($nodeDir.FullName)\*" "node\" -Recurse -Force
          echo "Node.js portable pronto em: node\"
          ls node\node.exe

      - name: Preparar pasta agent-files com todos os arquivos
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "agent-files" -Force | Out-Null
          # Copiar arquivos do agente
          Copy-Item "index.js" "agent-files\" -Force
          Copy-Item "package.json" "agent-files\" -Force
          if (Test-Path "package-lock.json") { Copy-Item "package-lock.json" "agent-files\" -Force }
          if (Test-Path "icon.ico") { Copy-Item "icon.ico" "agent-files\" -Force }
          # Copiar node_modules (com binários nativos já compilados para Windows)
          Copy-Item "node_modules" "agent-files\node_modules" -Recurse -Force
          # Copiar Node.js portable
          Copy-Item "node" "agent-files\node" -Recurse -Force
          echo "Conteúdo de agent-files:"
          ls agent-files\

      - name: Criar script de inicialização .bat
        shell: pwsh
        run: |
          $bat = "@echo off`r`n"
          $bat += "title InterTeste Agent`r`n"
          $bat += "cd /d `"%~dp0`"`r`n"
          $bat += "echo Iniciando InterTeste Agent...`r`n"
          $bat += ".\\node\\node.exe index.js`r`n"
          $bat += "pause`r`n"
          $bat | Out-File -FilePath "agent-files\interteste-agent.bat" -Encoding ASCII
          echo "Script .bat criado"
          cat agent-files\interteste-agent.bat

      - name: Instalar NSIS via Chocolatey
        run: choco install nsis -y

      - name: Adicionar NSIS ao PATH
        shell: pwsh
        run: |
          $nsisPath = "C:\Program Files (x86)\NSIS"
          if (Test-Path $nsisPath) {
            echo "$nsisPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            echo "NSIS encontrado em: $nsisPath"
          } else {
            $found = Get-ChildItem -Path "C:\" -Recurse -Filter "makensis.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              $dir = $found.DirectoryName
              echo "$dir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              echo "makensis encontrado em: $dir"
            } else {
              echo "makensis não encontrado!"
              exit 1
            }
          }

      - name: Compilar instalador NSIS
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          & makensis /DAPP_VERSION_OVERRIDE=$version installer.nsi
          $outFile = "InterTeste-Agent-Setup-v${version}.exe"
          if (Test-Path $outFile) {
            $size = [math]::Round((Get-Item $outFile).Length / 1MB, 1)
            echo "Instalador gerado: $outFile ($size MB)"
          } else {
            echo "Arquivo não encontrado: $outFile"
            ls *.exe
            exit 1
          }

      - name: Upload do instalador para a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          files: InterTeste-Agent-Setup-v${{ steps.version.outputs.VERSION }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Compilar binário Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Instalar pkg globalmente
        run: npm install -g pkg

      - name: Extrair versão do package.json
        id: version
        run: echo "VERSION=$(node -e "process.stdout.write(require('./package.json').version)")" >> $GITHUB_OUTPUT

      - name: Compilar binário Linux x64
        run: |
          mkdir -p dist
          pkg index.js --targets node18-linux-x64 --output dist/interteste-agent-linux-v${{ steps.version.outputs.VERSION }}

      - name: Verificar tamanho do binário
        run: ls -lh dist/

      - name: Upload do binário Linux para a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          files: dist/interteste-agent-linux-v${{ steps.version.outputs.VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
